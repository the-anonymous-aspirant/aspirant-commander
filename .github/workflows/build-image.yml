# Build and push the aspirant-commander image to GHCR on every push to main.
# Test/validation is local-only (per #11 strip of ci.yml); this workflow
# carries ONLY the build+push half so the deploy pipeline isn't blocked.

name: Build Image

on:
  push:
    branches: [main]

# Serialize builds per ref, as aspirant-server does since its #4761, so two
# merges landing seconds apart cannot push :latest out of commit order
# (system_3 #9966: aspirant-client's site lost two merges that way).
# cancel-in-progress: false queues a run behind the one in flight, and a newer
# pending run replaces an older pending one, so the last run is the newest
# push. Every run that does start still pushes its own sha- tag.
concurrency:
  group: build-image-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
    - uses: actions/checkout@v4
    # The concurrency group orders pushes, but a re-run of an older run joins
    # the same queue and would still retag :latest with its older commit,
    # rolling the deploy back. So the moving tags (:latest, :main) go only on a
    # build of the commit that is main's head right now; any other build still
    # pushes its sha- tag. If the head cannot be read, the build fails rather
    # than guessing (system_3 #9966/#9983; aspirant-client #409).
    - name: Is this commit main's head?
      id: head
      run: bash scripts/is-main-head.sh "$GITHUB_SHA" >> "$GITHUB_OUTPUT"
    - uses: docker/setup-buildx-action@v3
    - uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=ref,event=branch,enable=${{ steps.head.outputs.is_head == 'true' }}
          type=sha
          type=raw,value=latest,enable=${{ steps.head.outputs.is_head == 'true' }}
    - name: Build and push
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile-Commander
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
